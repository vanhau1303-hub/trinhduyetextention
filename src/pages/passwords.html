<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Mật khẩu đã lưu</title>
  <link rel="icon" href="metal://favicon/" />
  <link rel="stylesheet" href="pages.css" />
  <style>
    .pw { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 18px; border-top: 1px solid var(--border); }
    .pw:first-child { border-top: 0; }
    .pw:hover { background: var(--hover); }
    .pw .site { width: 34%; min-width: 0; display: flex; align-items: center; gap: 10px; }
    .pw .user { width: 26%; min-width: 0; }
    .pw .pass { flex: 1; min-width: 0; font-family: Consolas, monospace; letter-spacing: 1px; }
    .pw .actions { display: flex; gap: 2px; flex: none; }
    .tip { background: var(--accent-soft); border-radius: 12px; padding: 12px 16px; font-size: 13px; margin-bottom: 16px; }
    .head { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
    .head .search { margin: 0; }
    .never { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 18px; border-top: 1px solid var(--border); }
    .never:first-child { border-top: 0; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side"></aside>
    <main class="main">
      <h1>Mật khẩu đã lưu</h1>
      <div class="tip" id="tip">🔒 Mật khẩu được <b>mã hoá bằng tài khoản Windows</b> (DPAPI) và chỉ lưu trên máy này — chép file sang máy hoặc tài khoản Windows khác cũng không đọc được. Khi đăng nhập một trang, Metal Browser sẽ hỏi có lưu không và tự điền ở lần sau.</div>
      <div class="head">
        <input type="search" class="search" id="q" placeholder="Tìm trang hoặc tên đăng nhập" />
        <button class="btn danger" id="clear">Xoá tất cả</button>
      </div>
      <div class="card" id="list"></div>

      <h2>Không bao giờ lưu cho các trang</h2>
      <div class="card" id="never"></div>
    </main>
  </div>
  <script src="common.js"></script>
  <script src="passwords.js"></script>
</body>
</html>
