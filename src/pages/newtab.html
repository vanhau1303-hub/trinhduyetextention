<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Tab mới</title>
  <link rel="icon" href="metal://favicon/" />
  <link rel="stylesheet" href="pages.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg) center / cover no-repeat fixed;
      overflow-x: hidden;
    }
    body.has-bg { --text: #fff; --dim: rgba(255, 255, 255, 0.85); }
    body.has-bg::before { content: ''; position: fixed; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.15) 50%, rgba(0, 0, 0, 0.35)); pointer-events: none; }
    .wrap { position: relative; width: min(760px, calc(100vw - 32px)); margin-top: 14vh; display: flex; flex-direction: column; align-items: center; }
    .clock { font-size: 64px; font-weight: 300; letter-spacing: -1px; line-height: 1; color: var(--text); }
    .date { color: var(--dim); margin: 8px 0 28px; font-size: 15px; }
    form { width: 100%; position: relative; }
    #q {
      width: 100%;
      height: 52px;
      border-radius: 26px;
      border: 1px solid var(--border);
      background: var(--card);
      padding: 0 24px 0 52px;
      font-size: 16px;
      outline: 0;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.08);
      color: #1f2633;
    }
    @media (prefers-color-scheme: dark) { #q { color: var(--text); } }
    #q:focus { border-color: var(--accent); }
    form svg { position: absolute; left: 20px; top: 16px; color: var(--dim); }
    body.has-bg form svg { color: #5f6b7c; }
    .engine { margin-top: 10px; color: var(--dim); font-size: 12.5px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px; width: 100%; margin-top: 40px; }
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px 8px 12px;
      border-radius: 14px;
      color: var(--text);
      text-decoration: none !important;
      transition: background 0.12s;
    }
    .tile:hover { background: var(--hover); }
    body.has-bg .tile:hover { background: rgba(255, 255, 255, 0.14); }
    .tile .ic { width: 52px; height: 52px; border-radius: 50%; background: var(--card); display: grid; place-items: center; box-shadow: var(--shadow); }
    .tile .ic img { width: 28px; height: 28px; }
    .tile span { font-size: 12.5px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: none; color: var(--dim); cursor: pointer; opacity: 0; font-size: 13px; }
    .tile:hover .x { opacity: 1; }
    .tile .x:hover { background: var(--hover); color: var(--text); }
    .corner { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; }
    .corner button { height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-size: 12.5px; }
    .corner button:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>
    <form id="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Tìm kiếm hoặc nhập địa chỉ web" autofocus />
    </form>
    <div class="engine" id="engine"></div>
    <div class="tiles" id="tiles"></div>
  </div>
  <div class="corner">
    <button id="bg">Đổi hình nền</button>
    <button id="bg-clear" class="hidden">Bỏ hình nền</button>
  </div>
  <script src="common.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
